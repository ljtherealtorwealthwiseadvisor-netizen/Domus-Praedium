<head>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=1600&q=80') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.overlay{
background:rgba(0,0,0,0.7);
padding:40px;
border-radius:10px;
max-width:600px;
width:100%;
}

.btn{
padding:15px 25px;
margin:10px;
border:none;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

.gold{
background:gold;
color:black;
}

.dark{
background:#222;
color:white;
}

.section{
padding:60px 20px;
text-align:center;
}

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#111;
padding:10px;
border-radius:12px;
width:260px;
}

.card img{
width:100%;
height:170px;
object-fit:cover;
border-radius:10px;
}

form{
max-width:600px;
margin:auto;
}

input,select{
padding:14px;
margin:10px 0;
width:100%;
border:none;
font-size:16px;
box-sizing:border-box;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
cursor:pointer;
z-index:999;
}

/* MOBILE */
@media(max-width:768px){

.hero{
height:auto;
padding:80px 20px;
}

.overlay h1{
font-size:36px;
}

.overlay p{
font-size:18px;
}

.btn{
width:100%;
}

.card{
width:100%;
max-width:320px;
}

}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<div class="overlay">

<h1>Find the Right Property Investment</h1>

<p>Property • Strategy • Legacy</p>

<button class="btn gold" onclick="scrollToForm()">
Schedule Viewing
</button>

<button class="btn dark" onclick="speakWithAdvisor()">
Speak with an Advisor
</button>

</div>
</div>

<!-- LOCATIONS -->
<div class="section">

<h2>Prime Locations</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80">
<p>Makati CBD</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600210492493-0946911123ea?auto=format&fit=crop&w=800&q=80">
<p>BGC Taguig</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80">
<p>Ortigas CBD</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&w=800&q=80">
<p>Pasig City</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600573472591-ee6b68d14c68?auto=format&fit=crop&w=800&q=80">
<p>Bay Area Pasay</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80">
<p>Quezon City</p>
</div>

</div>
</div>

<!-- FORM -->
<div class="section" id="form">

<h2>Schedule Your Private Viewing</h2>

<form onsubmit="submitForm(event)">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="phone" placeholder="Phone Number" required>

<select id="type" required>
<option value="">Property Type</option>
<option>Condo</option>
<option>House & Lot</option>
</select>

<select id="status" required>
<option value="">Project Status</option>
<option>Pre-selling</option>
<option>Ready for Occupancy (RFO)</option>
</select>

<select id="location" required>
<option value="">Preferred Location</option>
<option>Makati</option>
<option>BGC</option>
<option>Ortigas</option>
<option>Pasig</option>
<option>Pasay</option>
<option>Quezon City</option>
</select>

<select id="budget" required>
<option value="">Budget Range</option>
<option>Below 3M</option>
<option>3M - 5M</option>
<option>5M - 8M</option>
<option>8M - 12M</option>
<option>12M - 20M</option>
<option>20M+</option>
</select>

<select id="viewing" required>
<option value="">Preferred Viewing Date</option>
<option>This Week</option>
<option>Next Week</option>
<option>This Month</option>
<option>Next Month</option>
</select>

<select id="timeline" required>
<option value="">Buying Timeline</option>
<option>ASAP</option>
<option>1-3 Months</option>
<option>3-6 Months</option>
<option>6-12 Months</option>
<option>Just Exploring</option>
</select>

<button class="btn gold" type="submit">
Submit
</button>

</form>
</div>

<!-- FLOATING WHATSAPP -->
<img
src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
class="whatsapp"
onclick="openWhatsApp()"
>

<script>

/* 👉 SPEAK WITH ADVISOR = LEAD */
function speakWithAdvisor(){

fbq('track', 'Lead');

setTimeout(function(){
window.location.href="https://api.whatsapp.com/send?phone=639690134227";
},500);

}

/* 👉 FLOATING WHATSAPP = CONTACT */
function openWhatsApp(){

fbq('track', 'Contact');

setTimeout(function(){
window.location.href="https://api.whatsapp.com/send?phone=639690134227";
},500);

}

/* 👉 SCROLL TO FORM */
function scrollToForm(){

document.getElementById("form")
.scrollIntoView({behavior:'smooth'});

}

/* 👉 FORM SUBMIT */
function submitForm(e){

e.preventDefault();

/* META EVENTS */
fbq('track','Lead');
fbq('trackCustom','Schedule');

/* GOOGLE EVENT */
gtag('event','conversion', {
'send_to':'AW-11442413834'
});

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let type=document.getElementById("type").value;
let status=document.getElementById("status").value;
let location=document.getElementById("location").value;
let budget=document.getElementById("budget").value;
let viewing=document.getElementById("viewing").value;
let timeline=document.getElementById("timeline").value;

let msg =
`Hi! I'm interested.

Name: ${name}
Phone: ${phone}
Property Type: ${type}
Project Status: ${status}
Preferred Location: ${location}
Budget Range: ${budget}
Viewing Date: ${viewing}
Buying Timeline: ${timeline}`;

setTimeout(function(){

window.location.href=
"https://api.whatsapp.com/send?phone=639690134227&text="
+ encodeURIComponent(msg);

},500);

}

</script>

</body>
</html>
