<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
}

input, select {
  width: 80%;
  padding: 12px;
  margin: 10px;
  border: none;
}

button {
  background: gold;
  border: none;
  padding: 12px 30px;
  cursor: pointer;
}

.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  cursor: pointer;
}
</style>

<body>

<h1>Schedule Your Private Viewing</h1>

<form id="form">

<input type="text" placeholder="Full Name" required><br>
<input type="text" placeholder="Phone Number" required><br>

<select required>
  <option value="">Property Type</option>
  <option>Condo</option>
  <option>House & Lot</option>
  <option>Lot Only</option>
</select><br>

<select required>
  <option value="">Project Status</option>
  <option>Pre-selling</option>
  <option>Ready for Occupancy</option>
</select><br>

<select required>
  <option value="">Preferred Location</option>
  <option>Metro Manila</option>
  <option>Cavite</option>
  <option>Laguna</option>
</select><br>

<select required>
  <option value="">Budget Range</option>
  <option>3M - 5M</option>
  <option>5M - 10M</option>
  <option>10M+</option>
</select><br>

<!-- ✅ RESTORED FIELDS -->
<select required>
  <option value="">Preferred Viewing Date</option>
  <option>Within 7 days</option>
  <option>Within 1 month</option>
  <option>Within 3 months</option>
  <option>Just exploring</option>
</select><br>

<select required>
  <option value="">Buying Timeline</option>
  <option>Ready now</option>
  <option>1-3 months</option>
  <option>3-6 months</option>
  <option>6-12 months</option>
  <option>Not sure yet</option>
</select><br>

<button type="submit">Submit</button>

</form>

<!-- WHATSAPP FLOAT -->
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
class="whatsapp"
onclick="openWhatsApp()">

<script>

/* WHATSAPP CLICK = CONTACT */
function openWhatsApp(){
  fbq('track', 'Contact');

  setTimeout(function(){
    window.location.href="https://api.whatsapp.com/send?phone=639690134227";
  }, 500);
}

/* FORM SUBMIT */
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  fbq('track', 'Lead');
  fbq('track', 'Schedule');

  alert("Submitted! We will contact you shortly.");
});

</script>
